name: CI - Test App and Build Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run app structure test
        run: node tests/test-app.js

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t css-flexbox-grid-playground .