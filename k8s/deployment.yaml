apiVersion: apps/v1
kind: Deployment
metadata:
  name: css-playground
  namespace: css-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: css-playground
  template:
    metadata:
      labels:
        app: css-playground
    spec:
      containers:
        - name: css-playground
          image: deebikanp/css-flexbox-grid-playground:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80